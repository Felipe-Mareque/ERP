<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro de Produto — Verdant ERP</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<link rel="stylesheet" href="../../css/base.css">
<link rel="stylesheet" href="../../css/layout.css">
<link rel="stylesheet" href="../../css/componentes.css">
<style>
  body { margin: 0; padding: 20px; }
</style>
</head>
<body>
<div class="tela" style="min-height:760px">

<div class="sidebar">
<div class="sidebar-logo"><i class="ti ti-leaf" aria-hidden="true"></i>Verdant erp</div>
<a href="../dashboard/dashboard.html" class="sidebar-item"><i class="ti ti-home" aria-hidden="true"></i>Painel</a>
<a href="listagem_produtos.html" class="sidebar-item sidebar-item--active"><i class="ti ti-package" aria-hidden="true"></i>Produtos</a>
<div class="sidebar-subitens"><a href="listagem_produtos.html" class="sidebar-subitem">Listagem</a><a href="cadastro_produto.html" class="sidebar-subitem--ativo">Cadastro</a></div>
<a href="../clientes/listagem_clientes.html" class="sidebar-item"><i class="ti ti-users" aria-hidden="true"></i>Clientes</a>
</div>

<div class="conteudo conteudo--scroll">

<div style="display:flex;justify-content:space-between;align-items:flex-start">
<div class="pagina-titulo">
<span class="pagina-titulo__breadcrumb">Produtos / Cadastro</span>
<span class="pagina-titulo__titulo">Novo produto</span>
<span class="pagina-titulo__sub">Cadastre as informações básicas do produto</span>
</div>
</div>

<div id="mensagem-sucesso" class="mensagem-sucesso"></div>

<form id="form-cadastro-produto" novalidate>

<div class="card">
<div class="card__titulo">Informações gerais</div>
<div class="form-secao">

<div class="form-grupo">
<label class="form-label" for="nome-produto">Nome do produto *</label>
<input type="text" id="nome-produto" placeholder="Ex: Notebook Dell Inspiron" class="form-input">
<span class="mensagem-erro" id="erro-nome-produto"></span>
</div>

<div style="display:grid;grid-template-columns:180px 1fr;gap:10px">
<div class="form-grupo">
<label class="form-label" for="sku-produto">SKU/Código *</label>
<input type="text" id="sku-produto" placeholder="NOTE-001" class="form-input">
<span class="mensagem-erro" id="erro-sku-produto"></span>
</div>
<div class="form-grupo">
<label class="form-label" for="categoria-produto">Categoria *</label>
<select id="categoria-produto" class="form-input">
<option value="">Selecionar categoria</option>
<option>Eletrônicos</option>
<option>Periféricos</option>
</select>
<span class="mensagem-erro" id="erro-categoria-produto"></span>
</div>
</div>

<div style="display:grid;grid-template-columns:180px 1fr;gap:10px">
<div class="form-grupo">
<label class="form-label" for="codigo-barras">Código de barras</label>
<input type="text" id="codigo-barras" placeholder="1234567890123" class="form-input">
</div>
<div class="form-grupo">
<label class="form-label" for="marca-produto">Marca</label>
<input type="text" id="marca-produto" placeholder="Ex: Dell, HP" class="form-input">
</div>
</div>

<div class="form-grupo">
<label class="form-label" for="descricao-produto">Descrição</label>
<textarea id="descricao-produto" placeholder="Descrição breve do produto..." class="form-input form-textarea"></textarea>
</div>

</div>
</div>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">

<div class="card">
<div class="card__titulo">Preços</div>
<div class="form-secao">

<div class="form-grupo">
<label class="form-label" for="preco-custo">Preço de custo</label>
<div class="form-input-icone">
<span style="font-size:12px;color:var(--sub)">R$</span>
<input type="text" id="preco-custo" placeholder="800,00">
</div>
</div>

<div class="form-grupo">
<label class="form-label" for="preco-venda">Preço de venda *</label>
<div class="form-input-icone">
<span style="font-size:12px;color:var(--sub)">R$</span>
<input type="text" id="preco-venda" placeholder="1.000,00">
</div>
<span class="mensagem-erro" id="erro-preco-venda"></span>
</div>

<div class="form-grupo">
<label class="form-label">Margem de lucro</label>
<div style="display:flex;align-items:center;justify-content:space-between;border:0.5px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--sec-bg)">
<span style="font-size:12px;color:var(--ink);font-weight:500" id="margem-lucro">—</span>
<span style="font-size:10px;color:var(--sub)">calculado</span>
</div>
</div>

</div>
</div>

<div class="card">
<div class="card__titulo">Estoque</div>
<div class="form-secao">

<div class="form-grupo">
<label class="form-label" for="estoque-inicial">Estoque inicial *</label>
<div class="form-input-icone">
<input type="text" id="estoque-inicial" placeholder="25">
<span style="font-size:11px;color:var(--sub);font-weight:500">UN</span>
</div>
<span class="mensagem-erro" id="erro-estoque-inicial"></span>
</div>

<div class="form-grupo">
<label class="form-label" for="unidade-medida">Unidade de medida *</label>
<select id="unidade-medida" class="form-input">
<option>UN - Unidade</option>
<option>KG - Quilograma</option>
<option>L - Litro</option>
</select>
</div>

<div class="form-grupo">
<label class="form-label" for="estoque-minimo">Estoque mínimo</label>
<div class="form-input-icone">
<input type="text" id="estoque-minimo" placeholder="5">
<span style="font-size:11px;color:var(--sub);font-weight:500">UN</span>
</div>
</div>

</div>
</div>

</div>

<div class="card">
<div class="card__titulo">Imagem do produto</div>
<div style="border:1px dashed var(--moss-mid);border-radius:8px;padding:22px;text-align:center;background:var(--sec-bg);display:flex;flex-direction:column;align-items:center;gap:8px">
<i class="ti ti-photo" style="font-size:24px;color:var(--sub)" aria-hidden="true"></i>
<span style="font-size:12px;font-weight:500;color:var(--ink)">Arrastar imagem aqui</span>
<span style="font-size:11px;color:var(--sub)">PNG, JPG ou WEBP • até 5 MB</span>
<div style="border:0.5px solid var(--line);border-radius:7px;padding:6px 12px;font-size:11px;color:var(--ink);background:#fff;margin-top:4px">Selecionar arquivo</div>
</div>
</div>

<div class="form-acoes">
<button type="button" id="botao-cancelar" class="btn btn-secundario--sutil">Cancelar</button>
<div class="form-acoes__direita">
<button type="button" id="botao-salvar-novo" class="btn btn-secundario">Salvar e novo</button>
<button type="submit" id="botao-salvar" class="btn btn-primario">Salvar</button>
</div>
</div>

</form>

</div>
</div>

<script src="../../js/cadastroProduto.js" defer></script>
</body>
</html>
