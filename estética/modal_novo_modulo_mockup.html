<div style="--bdark:#14311f;--moss:#5f7f62;--moss-l:#9ebb9f;--moss-pale:#e2ebe1;--bg:#f2f5f1;--ink:#1b251e;--sub:#71806f;--line:#d5e0d3;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;position:relative;width:100%;min-height:480px;background:var(--bg);border-radius:12px;overflow:hidden;border:0.5px solid var(--line)">

<div style="position:absolute;inset:0;background:rgba(20,49,31,0.35);display:flex;align-items:center;justify-content:center;padding:20px">

<div style="width:100%;max-width:360px;background:#fff;border-radius:12px;box-shadow:0 12px 32px rgba(20,49,31,0.25);overflow:hidden">

<div style="display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:0.5px solid var(--line)">
<span style="font-size:14px;font-weight:500;color:var(--ink)">Novo módulo</span>
<i class="ti ti-x" style="font-size:15px;color:var(--sub)" aria-hidden="true"></i>
</div>

<div style="padding:18px;display:flex;flex-direction:column;gap:14px">

<div style="display:flex;flex-direction:column;gap:5px">
<label style="font-size:12px;color:var(--sub)">Nome do módulo</label>
<div style="border:0.5px solid var(--line);border-radius:9px;padding:10px 12px;background:#fff;font-size:13px;color:var(--sub)">Ex: Contratos</div>
</div>

<div style="display:flex;flex-direction:column;gap:5px">
<label style="font-size:12px;color:var(--sub)">Ícone</label>
<div style="display:flex;gap:8px">
<div style="width:36px;height:36px;border-radius:8px;background:var(--moss);display:flex;align-items:center;justify-content:center"><i class="ti ti-file-text" style="font-size:16px;color:#fff" aria-hidden="true"></i></div>
<div style="width:36px;height:36px;border-radius:8px;border:0.5px solid var(--line);display:flex;align-items:center;justify-content:center"><i class="ti ti-package" style="font-size:16px;color:var(--sub)" aria-hidden="true"></i></div>
<div style="width:36px;height:36px;border-radius:8px;border:0.5px solid var(--line);display:flex;align-items:center;justify-content:center"><i class="ti ti-users" style="font-size:16px;color:var(--sub)" aria-hidden="true"></i></div>
<div style="width:36px;height:36px;border-radius:8px;border:0.5px solid var(--line);display:flex;align-items:center;justify-content:center"><i class="ti ti-cash" style="font-size:16px;color:var(--sub)" aria-hidden="true"></i></div>
<div style="width:36px;height:36px;border-radius:8px;border:0.5px solid var(--line);display:flex;align-items:center;justify-content:center"><i class="ti ti-truck" style="font-size:16px;color:var(--sub)" aria-hidden="true"></i></div>
</div>
</div>

<div style="display:flex;flex-direction:column;gap:5px">
<label style="font-size:12px;color:var(--sub)">Posição na lista</label>
<div style="display:flex;align-items:center;justify-content:space-between;border:0.5px solid var(--line);border-radius:9px;padding:10px 12px;background:#fff;font-size:13px;color:var(--ink)">
<span>No final da lista</span>
<i class="ti ti-chevron-down" style="font-size:14px;color:var(--sub)" aria-hidden="true"></i>
</div>
</div>

</div>

<div style="display:flex;justify-content:flex-end;gap:8px;padding:14px 18px;border-top:0.5px solid var(--line);background:var(--moss-pale)">
<div style="padding:9px 16px;border-radius:8px;font-size:12px;color:var(--sub);border:0.5px solid var(--line);background:#fff">Cancelar</div>
<div style="padding:9px 16px;border-radius:8px;font-size:12px;color:#fff;background:var(--moss);font-weight:500">Criar módulo</div>
</div>

</div>

</div>

</div>
