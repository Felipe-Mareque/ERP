<div style="--bdark:#14311f;--moss:#5f7f62;--moss-l:#9ebb9f;--moss-pale:#e2ebe1;--moss-mid:#c7d8c6;--bg:#f2f5f1;--sec-bg:#e6ede4;--ink:#1b251e;--sub:#71806f;--line:#d5e0d3;--ok:#3f7a4f;--ok-bg:#e4f0e5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;display:flex;width:100%;min-height:900px;background:var(--bg);border-radius:12px;overflow:hidden;border:0.5px solid var(--line)">

<div style="width:196px;flex-shrink:0;background:var(--bdark);padding:15px 10px;display:flex;flex-direction:column;gap:9px;font-size:12px">
<div style="display:flex;align-items:center;gap:8px;color:#fff;font-size:14px;font-weight:500;padding:0 6px 5px"><i class="ti ti-leaf" style="font-size:17px;color:var(--moss-l)" aria-hidden="true"></i>Verdant erp</div>
<div style="display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:7px;color:#e3ebe2"><i class="ti ti-home" style="font-size:14px" aria-hidden="true"></i>Painel</div>
<div style="display:flex;align-items:center;gap:8px;padding:7px 8px;color:#e3ebe2"><i class="ti ti-package" style="font-size:14px" aria-hidden="true"></i>Produtos</div>
<div style="display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:7px;background:var(--moss);color:#fff"><i class="ti ti-users" style="font-size:14px" aria-hidden="true"></i>Clientes</div>
<div style="padding-left:30px;display:flex;flex-direction:column"><div style="padding:4px 0;color:#a9c0aa">Listagem</div><div style="padding:4px 0;color:#fff;font-weight:500">Cadastro</div></div>
</div>

<div style="flex:1;min-width:0;padding:22px 26px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;max-width:520px">

<div style="display:flex;flex-direction:column;gap:3px">
<span style="font-size:11px;color:var(--sub)">Clientes / Cadastro</span>
<span style="font-size:17px;font-weight:500;color:var(--ink)">Novo cliente</span>
<span style="font-size:12px;color:var(--sub)">Preencha as informações para cadastrar um novo cliente</span>
</div>

<div style="background:#fff;border:0.5px solid var(--line);border-radius:10px;padding:16px 18px">
<div style="display:flex;align-items:center;gap:8px;margin-bottom:14px">
<div style="width:18px;height:18px;border-radius:50%;background:var(--moss);color:#fff;font-size:10px;font-weight:500;display:flex;align-items:center;justify-content:center">1</div>
<div style="font-size:12px;font-weight:500;color:var(--ink)">Identificação</div>
</div>
<div style="display:flex;flex-direction:column;gap:11px">

<div style="display:flex;flex-direction:column;gap:6px">
<label style="font-size:11px;color:var(--sub)">Tipo de pessoa</label>
<div style="display:flex;gap:16px">
<span style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink)"><span style="width:14px;height:14px;border-radius:50%;border:1.5px solid var(--moss);display:inline-flex;align-items:center;justify-content:center"><span style="width:7px;height:7px;border-radius:50%;background:var(--moss)"></span></span>Pessoa física</span>
<span style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub)"><span style="width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line);display:inline-flex"></span>Pessoa jurídica</span>
</div>
</div>

<div style="display:flex;flex-direction:column;gap:5px">
<label style="font-size:11px;color:var(--sub)">Nome / Razão social *</label>
<input type="text" placeholder="Ex: João da Silva" style="border:0.5px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--ink);background:#fff;font-family:inherit">
</div>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
<div style="display:flex;flex-direction:column;gap:5px">
<label style="font-size:11px;color:var(--sub)">CPF / CNPJ *</label>
<input type="text" placeholder="000.000.000-00" style="border:0.5px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--ink);background:#fff;font-family:inherit">
</div>
<div style="display:flex;flex-direction:column;gap:5px">
<label style="font-size:11px;color:var(--sub)">Nome fantasia</label>
<input type="text" placeholder="Opcional" style="border:0.5px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--ink);background:#fff;font-family:inherit">
</div>
</div>

</div>
</div>

<div style="background:#fff;border:0.5px solid var(--line);border-radius:10px;padding:16px 18px">
<div style="display:flex;align-items:center;gap:8px;margin-bottom:14px">
<div style="width:18px;height:18px;border-radius:50%;background:var(--moss);color:#fff;font-size:10px;font-weight:500;display:flex;align-items:center;justify-content:center">2</div>
<div style="font-size:12px;font-weight:500;color:var(--ink)">Contato</div>
</div>
<div style="display:flex;flex-direction:column;gap:11px">

<div style="display:flex;flex-direction:column;gap:5px">
<label style="font-size:11px;color:var(--sub)">E-mail</label>
<div style="display:flex;align-items:center;gap:6px;border:0.5px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff">
<i class="ti ti-mail" style="font-size:13px;color:var(--sub)" aria-hidden="true"></i>
<input type="text" placeholder="nome@email.com" style="border:none;background:transparent;font-size:12px;flex:1;outline:none;color:var(--ink);font-family:inherit">
</div>
</div>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
<div style="display:flex;flex-direction:column;gap:5px">
<label style="font-size:11px;color:var(--sub)">Telefone</label>
<input type="text" placeholder="(00) 0000-0000" style="border:0.5px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--ink);background:#fff;font-family:inherit">
</div>
<div style="display:flex;flex-direction:column;gap:5px">
<label style="font-size:11px;color:var(--sub)">Celular</label>
<input type="text" placeholder="(00) 00000-0000" style="border:0.5px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--ink);background:#fff;font-family:inherit">
</div>
</div>

</div>
</div>

<div style="background:#fff;border:0.5px solid var(--line);border-radius:10px;padding:16px 18px">
<div style="display:flex;align-items:center;gap:8px;margin-bottom:14px">
<div style="width:18px;height:18px;border-radius:50%;background:var(--moss);color:#fff;font-size:10px;font-weight:500;display:flex;align-items:center;justify-content:center">3</div>
<div style="font-size:12px;font-weight:500;color:var(--ink)">Endereço</div>
</div>
<div style="display:flex;flex-direction:column;gap:11px">

<div style="display:flex;flex-direction:column;gap:5px;max-width:160px">
<label style="font-size:11px;color:var(--sub)">CEP *</label>
<input type="text" placeholder="00000-000" style="border:0.5px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--ink);background:#fff;font-family:inherit">
</div>

<div style="display:grid;grid-template-columns:1fr 110px;gap:10px">
<div style="display:flex;flex-direction:column;gap:5px">
<label style="font-size:11px;color:var(--sub)">Rua *</label>
<input type="text" placeholder="Rua Gonçalves Chaves" style="border:0.5px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--ink);background:#fff;font-family:inherit">
</div>
<div style="display:flex;flex-direction:column;gap:5px">
<label style="font-size:11px;color:var(--sub)">Número *</label>
<input type="text" placeholder="1290" style="border:0.5px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--ink);background:#fff;font-family:inherit">
</div>
</div>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
<div style="display:flex;flex-direction:column;gap:5px">
<label style="font-size:11px;color:var(--sub)">Complemento</label>
<input type="text" placeholder="Apto, sala, bloco..." style="border:0.5px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--ink);background:#fff;font-family:inherit">
</div>
<div style="display:flex;flex-direction:column;gap:5px">
<label style="font-size:11px;color:var(--sub)">Bairro *</label>
<input type="text" placeholder="Centro" style="border:0.5px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--ink);background:#fff;font-family:inherit">
</div>
</div>

<div style="display:grid;grid-template-columns:1fr 90px;gap:10px">
<div style="display:flex;flex-direction:column;gap:5px">
<label style="font-size:11px;color:var(--sub)">Cidade *</label>
<input type="text" placeholder="Pelotas" style="border:0.5px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--ink);background:#fff;font-family:inherit">
</div>
<div style="display:flex;flex-direction:column;gap:5px">
<label style="font-size:11px;color:var(--sub)">Estado *</label>
<select style="border:0.5px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--ink);background:#fff;font-family:inherit">
<option selected>RS</option>
<option>SC</option>
<option>SP</option>
</select>
</div>
</div>

</div>
</div>

<div style="background:#fff;border:0.5px solid var(--line);border-radius:10px;padding:16px 18px">
<div style="display:flex;align-items:center;gap:8px;margin-bottom:14px">
<div style="width:18px;height:18px;border-radius:50%;background:var(--moss);color:#fff;font-size:10px;font-weight:500;display:flex;align-items:center;justify-content:center">4</div>
<div style="font-size:12px;font-weight:500;color:var(--ink)">Informações adicionais</div>
</div>
<div style="display:flex;flex-direction:column;gap:11px">

<div style="display:flex;flex-direction:column;gap:5px;max-width:200px">
<label style="font-size:11px;color:var(--sub)">Código do cliente</label>
<div style="border:0.5px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--sub);background:var(--sec-bg)">CLI-000143</div>
</div>

<div style="display:flex;flex-direction:column;gap:5px">
<label style="font-size:11px;color:var(--sub)">Observações</label>
<textarea placeholder="Notas gerais sobre o cliente..." style="border:0.5px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--ink);background:#fff;font-family:inherit;min-height:56px;resize:vertical"></textarea>
</div>

<div style="display:flex;flex-direction:column;gap:5px">
<label style="font-size:11px;color:var(--sub)">Status</label>
<span style="display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ok);width:fit-content"><span style="width:7px;height:7px;border-radius:50%;background:var(--ok)"></span>Ativo</span>
</div>

</div>
</div>

<div style="display:flex;justify-content:flex-end;gap:8px;padding-top:2px">
<div style="border:0.5px solid var(--line);border-radius:8px;padding:9px 16px;font-size:12px;color:var(--sub);background:#fff">Cancelar</div>
<div style="background:var(--moss);color:#fff;padding:9px 16px;border-radius:8px;font-size:12px;font-weight:500">Salvar</div>
</div>

</div>
</div>
