<div style="--bdark:#14311f;--moss:#5f7f62;--moss-l:#9ebb9f;--moss-pale:#e2ebe1;--moss-mid:#c7d8c6;--bg:#f2f5f1;--sec-bg:#e6ede4;--ink:#1b251e;--sub:#71806f;--line:#d5e0d3;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;width:100%;background:var(--bg);border-radius:12px;overflow:hidden;border:0.5px solid var(--line);padding:20px">

<div style="text-align:center;font-size:12px;color:var(--sub);margin-bottom:16px">Duas variações do mesmo formulário — o que muda ao trocar o "Tipo de item"</div>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">

<!-- COLUNA PRODUTO -->
<div style="display:flex;flex-direction:column;gap:14px">
<div style="text-align:center;font-size:11px;font-weight:500;color:var(--moss);background:var(--moss-pale);padding:5px;border-radius:6px">TIPO: PRODUTO</div>

<div style="background:#fff;border:0.5px solid var(--line);border-radius:10px;padding:16px 18px">
<div style="font-size:12px;font-weight:500;color:var(--ink);margin-bottom:12px">Identificação</div>
<div style="display:flex;flex-direction:column;gap:11px">

<div style="display:flex;flex-direction:column;gap:6px">
<label style="font-size:11px;color:var(--sub)">Tipo de item</label>
<div style="display:flex;gap:16px">
<span style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink)"><span style="width:14px;height:14px;border-radius:50%;border:1.5px solid var(--moss);display:inline-flex;align-items:center;justify-content:center"><span style="width:7px;height:7px;border-radius:50%;background:var(--moss)"></span></span>Produto</span>
<span style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub)"><span style="width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line);display:inline-flex"></span>Serviço</span>
</div>
</div>

<div style="display:flex;flex-direction:column;gap:5px">
<label style="font-size:11px;color:var(--sub)">Nome do item *</label>
<input type="text" placeholder="Ex: Notebook Dell Inspiron" style="border:0.5px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--ink);background:#fff;font-family:inherit">
</div>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
<div style="display:flex;flex-direction:column;gap:5px">
<label style="font-size:11px;color:var(--sub)">SKU/Código *</label>
<input type="text" placeholder="NOTE-001" style="border:0.5px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--ink);background:#fff;font-family:inherit">
</div>
<div style="display:flex;flex-direction:column;gap:5px">
<label style="font-size:11px;color:var(--sub)">Categoria *</label>
<select style="border:0.5px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--ink);background:#fff;font-family:inherit">
<option>Eletrônicos</option>
</select>
</div>
</div>

</div>
</div>

<div style="background:#fff;border:0.5px solid var(--line);border-radius:10px;padding:16px 18px">
<div style="font-size:12px;font-weight:500;color:var(--ink);margin-bottom:12px">Preços</div>
<div style="display:flex;flex-direction:column;gap:11px">
<div style="display:flex;flex-direction:column;gap:5px">
<label style="font-size:11px;color:var(--sub)">Preço de venda *</label>
<div style="display:flex;align-items:center;gap:6px;border:0.5px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff">
<span style="font-size:12px;color:var(--sub)">R$</span>
<input type="text" placeholder="1.000,00" style="border:none;background:transparent;font-size:12px;flex:1;outline:none;color:var(--ink);font-family:inherit">
</div>
</div>
</div>
</div>

<div style="background:#fff;border:0.5px solid var(--moss);border-radius:10px;padding:16px 18px">
<div style="font-size:12px;font-weight:500;color:var(--moss);margin-bottom:12px">📦 Estoque</div>
<div style="display:flex;flex-direction:column;gap:11px">
<div style="display:flex;flex-direction:column;gap:5px">
<label style="font-size:11px;color:var(--sub)">Estoque inicial *</label>
<div style="display:flex;align-items:center;gap:6px;border:0.5px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff">
<input type="text" placeholder="25" style="border:none;background:transparent;font-size:12px;flex:1;outline:none;color:var(--ink);font-family:inherit">
<span style="font-size:11px;color:var(--sub);font-weight:500">UN</span>
</div>
</div>
<div style="display:flex;flex-direction:column;gap:5px">
<label style="font-size:11px;color:var(--sub)">Unidade de medida *</label>
<select style="border:0.5px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--ink);background:#fff;font-family:inherit">
<option>UN - Unidade</option>
</select>
</div>
</div>
</div>

</div>

<!-- COLUNA SERVIÇO -->
<div style="display:flex;flex-direction:column;gap:14px">
<div style="text-align:center;font-size:11px;font-weight:500;color:var(--moss);background:var(--moss-pale);padding:5px;border-radius:6px">TIPO: SERVIÇO</div>

<div style="background:#fff;border:0.5px solid var(--line);border-radius:10px;padding:16px 18px">

<div style="display:flex;flex-direction:column;gap:11px">

<div style="display:flex;flex-direction:column;gap:6px">

<div style="display:flex;gap:16px">
<span style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub)"><span style="width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line);display:inline-flex"></span>Produto</span>
<span style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink)"><span style="width:14px;height:14px;border-radius:50%;border:1.5px solid var(--moss);display:inline-flex;align-items:center;justify-content:center"><span style="width:7px;height:7px;border-radius:50%;background:var(--moss)"></span></span>Serviço</span>
</div>
</div>

<div style="display:flex;flex-direction:column;gap:5px">
<label style="font-size:11px;color:var(--sub)">Nome do item *</label>
<input type="text" placeholder="Ex: Consultoria de TI" style="border:0.5px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--ink);background:#fff;font-family:inherit">
</div>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
<div style="display:flex;flex-direction:column;gap:5px">
<label style="font-size:11px;color:var(--sub)">SKU/Código *</label>
<input type="text" placeholder="SERV-001" style="border:0.5px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--ink);background:#fff;font-family:inherit">
</div>
<div style="display:flex;flex-direction:column;gap:5px">
<label style="font-size:11px;color:var(--sub)">Categoria *</label>
<select style="border:0.5px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--ink);background:#fff;font-family:inherit">
<option>Consultoria</option>
</select>
</div>
</div>

</div>
</div>

<div style="background:#fff;border:0.5px solid var(--line);border-radius:10px;padding:16px 18px">
<div style="font-size:12px;font-weight:500;color:var(--ink);margin-bottom:12px">Preços</div>
<div style="display:flex;flex-direction:column;gap:11px">
<div style="display:flex;flex-direction:column;gap:5px">
<label style="font-size:11px;color:var(--sub)">Preço do serviço *</label>
<div style="display:flex;align-items:center;gap:6px;border:0.5px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff">
<span style="font-size:12px;color:var(--sub)">R$</span>
<input type="text" placeholder="150,00" style="border:none;background:transparent;font-size:12px;flex:1;outline:none;color:var(--ink);font-family:inherit">
</div>
</div>
</div>
</div>

<div style="background:#fff;border:0.5px solid var(--moss);border-radius:10px;padding:16px 18px">
<div style="font-size:12px;font-weight:500;color:var(--moss);margin-bottom:12px">🛠️ Detalhes do serviço</div>
<div style="display:flex;flex-direction:column;gap:11px">
<div style="display:flex;flex-direction:column;gap:5px">
<label style="font-size:11px;color:var(--sub)">Duração estimada</label>
<input type="text" placeholder="Ex: 2 horas, 5 dias úteis" style="border:0.5px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--ink);background:#fff;font-family:inherit">
</div>
<div style="display:flex;flex-direction:column;gap:5px">
<label style="font-size:11px;color:var(--sub)">Tipo de cobrança *</label>
<select style="border:0.5px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--ink);background:#fff;font-family:inherit">
